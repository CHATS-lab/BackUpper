# Global run configuration. `run.sh` is the single entry point for every arm;
# this file selects which agent harness it drives and with what defaults.
#
# Nothing here is benchmark semantics. Turn sequencing, between_turns hooks,
# predicate execution and outcome classification live in run.sh and apply
# identically to every harness -- a v2 task must grade the same regardless of
# which agent produced the trajectory, or arms are not comparable.

# Which adapter run.sh drives. One of the stems in harness/adapters/.
#   claude  -- Claude Code inside the task container (arms A and B)
#   hermes  -- hermes + OpenRouter (arm C legacy path)
#   codex   -- codex-cli (OpenAI Codex CLI) inside the task container, via
#              OpenRouter (UNTESTED end-to-end -- see run_task_codex.sh header)
# Override per invocation with `--harness NAME` or RB_HARNESS=NAME.
harness: claude

# Where tasks come from, relative to regretbench/. run.sh dispatches on the
# schema present in each task.yaml, not on the directory. Every task in this
# release is v2 (`turns:`); the per-band subdirectories are selected with
# --tasks-dir tasks/<band>.
tasks_dir: tasks/terminal

defaults:
  samples: 1
  # Applied as one timeout around the WHOLE agent run, matching what the
  # runners actually enforce today. v2 tasks carry per-turn budgets in a
  # comment for when real per-turn support lands; see TURNS-FORMAT.md.
  agent_timeout_sec: 600
  predicate_timeout_sec: 300

harnesses:
  claude:
    runner: run_task_claude.sh
    # 2026-08-26: screening experiments switched to Sonnet (per user instruction).
    # Note this changes what the label means: READY was originally defined as
    # "Opus actually carried out the DEST" -- and Opus refusing more often was
    # exactly why it was chosen in the first place. Sonnet is a looser bar, so
    # tasks that pass under Sonnet will include some Opus would refuse to
    # destroy. The corpus is therefore a mix of Opus-verified and
    # Sonnet-verified tasks. The model for each run is recorded in
    # results/<run>/session.env and driver.log, so they can be told apart after the fact.
    model: claude-sonnet-5
    # SUBSCRIPTION, not gateway. `auth: gateway` here silently routed every run
    # through the OpenRouter sidecar and drained the account's credits, because
    # run.sh:79 exports this as RB_CLAUDE_AUTH unless the caller already set it --
    # so a sweep that did not explicitly pass RB_CLAUDE_AUTH=subscription got the
    # gateway regardless of intent. Runs are meant to execute on the host's Claude
    # Code subscription.
    # The credential is still COPIED into the container, never bind-mounted, so a
    # task that traps on `rm -rf ~` cannot reach the host's real credential file.
    auth: subscription
    results_dir: results/claude
  hermes:
    runner: run_task.sh
    model: deepseek/deepseek-v4-pro
    results_dir: results/hermes
  codex:
    runner: run_task_codex.sh
    model: openai/gpt-5.6-terra
    # No sidecar/subscription option for codex: its OpenRouter provider reads
    # OPENROUTER_API_KEY directly (env_key in config.toml), so this is always
    # a "direct" posture -- the key is visible to the agent under test inside
    # the container. auth: is unused by adapters/codex.sh (kept for schema
    # parity with the other entries; run.sh exports it as RB_CLAUDE_AUTH,
    # which run_task_codex.sh never reads).
    auth: direct
    results_dir: results/codex

judge:
  # v1 only. v2 replaces the blind judge with predicate execution -- the
  # revelation turn is a functional test, so there is nothing to opine about.
  model: anthropic/claude-sonnet-4.5
  backend: claude-cli
