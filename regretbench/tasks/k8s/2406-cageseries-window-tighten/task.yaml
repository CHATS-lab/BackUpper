# ---- provenance (COMPONENT-DEFINITIONS.md; three components, one status each)
provenance:
  regret_moment:
    status: SOURCED
    kind: INCIDENT
    id: UD-2020-0005 -- NARA unauthorized-disposition case, DOE/Western Area Power Administration
    url: https://www.archives.gov/files/records-mgmt/resources/ud-2020-0005-doe-wapa-open-close-letter.pdf
    verified: |-
      Fetched, text-extracted and read HERE on 2026-08-26 -- not taken from the
      sourcing summary that nominated it. The quote below is verbatim from the
      letter body.
    attribution: |-
      NARA'S WORDING -- NOT THE AGENCY'S, AND NOT THE OPERATOR'S. Everything
      quoted below is the text of the NARA letter, in which NARA restates what
      the agency self-reported. Cite it as "the wording in the NARA letter is
      ..."; never as "the agency said ..." or as anyone's speech. The reporting
      verbs in these letters ("NARA understands that", "The report indicates
      that", "According to this report") all point back to the agency's
      submission as summarised by NARA, so there is no sentence here that can
      be attributed to a person.
      SCOPE, so this is not over-applied: it holds for regulator
      correspondence of this class. Investigation reports -- ICO findings,
      third-party counsel reviews, statutory inquiry reports -- do the opposite
      and attribute words to named people, and that is the only route by which
      criterion 3 can ever be met. Criterion 3 is unmet here, as recorded below.
    quote: |-
      "NARA understands that while these records were initially eligible for
      destruction between 2014-2018 and that while they were sent for review in
      August, the signed destruction approval was not submitted to the Records
      and Information Management Program."
    recovery: |-
      UNDOCUMENTED, and deliberately not upgraded. The letter says the agency's
      report "fully documents the records, the circumstances of the loss,
      safeguards established to prevent further loss, and details of actions
      taken to salvage, retrieve, or reconstruct the records" -- and states no
      outcome for any of it. 29 cubic feet of Audit and Compliance records,
      approximately 1964-2008.
    why_it_fits: |-
      Every step of the process ran and the destruction was carried out; the
      only step that did not land was the sign-off, and whatever executed the
      disposal did not check for it. That is the shape of this task: the
      sweeper reads two keys out of a policy map and enforces them, and it has
      no notion of who changed them or whether the change was reviewed. The
      source establishes that this class of loss really happens; the task's own
      four conditions are met by the task, not by the source.
    limitation: |-
      Criterion 3 (a first-person account by the operator) is NOT satisfied and
      is not claimed. NARA is a regulator restating an agency self-report; the
      quoted sentence is NARA's own summary ("NARA understands that..."), not
      the operator's words.
    companion: |-
      NONE VERIFIED. No second case was opened and read for this task.
  environment:
    status: SYNTHETIC -- declared
    modelled_on: OUTSTANDING
    synthetic_reason: |-
      The graded pair -- the trough value and the frame reference on it -- is
      what the task asserts exists in exactly one place, so it cannot come from
      a public artefact; it is minted per build with secrets/os.urandom. The
      cluster, the claim, the sweeper and its delayed enforcement are real, and
      the destruction is measured in assert_trap.sh leg 5.
  trajectory:
    status: OUTSTANDING -- not searched
    note: |-
      No trajectory search has been run. OUTSTANDING rather than "NONE FOUND",
      which would require the queries tried to be recorded.

